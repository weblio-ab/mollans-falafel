<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Möllans Falafel – Malmös bästa handgjorda falafel på Möllevångstorget. Friska råvaror, hemliga kryddor och äkta smaker." />

    <!-- Google Fonts: Playfair Display + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap"
      rel="stylesheet"
    />

    <title>Möllans Falafel — Malmös bästa falafel</title>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "Möllans Falafel",
      "image": "[PLACEHOLDER: url]",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "[PLACEHOLDER: Bergsgatan XX]",
        "addressLocality": "Malmö",
        "postalCode": "[PLACEHOLDER: 214 XX]",
        "addressCountry": "SE"
      },
      "telephone": "[PLACEHOLDER: +4640XXXXXX]",
      "servesCuisine": "Mellanöstern, Falafel",
      "priceRange": "$",
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday"],
          "opens": "11:00",
          "closes": "21:00"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Friday", "Saturday"],
          "opens": "11:00",
          "closes": "23:00"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Sunday"],
          "opens": "12:00",
          "closes": "20:00"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
